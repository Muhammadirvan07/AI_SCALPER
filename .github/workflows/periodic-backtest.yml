name: Weekly one-year deterministic paper backtest

on:
  schedule:
    - cron: "17 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-one-year-walk-forward:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AI_SCALPER_LIVE_ALLOWED: "false"
      AI_SCALPER_EXECUTION_MODE: "PAPER"
      OPENAI_DECISION_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install --disable-pip-version-check --no-input -r requirements.txt
      - name: Run deterministic-only one-year cost-aware purged walk-forward backtest
        run: python scripts/run_periodic_backtest.py
      - uses: actions/upload-artifact@v4
        with:
          name: deterministic-periodic-backtest-1y-${{ github.run_id }}
          path: periodic_backtest_1y_report.json
          if-no-files-found: error
          retention-days: 90
