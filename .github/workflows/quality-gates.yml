name: Read-only quality gates

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONNOUSERSITE: "1"
  AI_SCALPER_LIVE_ALLOWED: "false"
  AI_SCALPER_SAFE_TO_DEMO_AUTO_ORDER: "false"
  AI_SCALPER_ORDER_CAPABILITY: "DISABLED"
  AI_SCALPER_MAX_LOT: "0.01"
  AI_SCALPER_EXECUTION_MODE: "PAPER"

jobs:
  repository-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Parse source, verify manifest sync, and enforce safety locks
        run: python scripts/verify_repository.py repository-validation

  root-tests:
    needs: repository-validation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-test.txt
            requirements.txt
            backend/requirements.txt
            dashboard_api/requirements.txt
      - name: Clean root test installation
        run: python -m pip install --disable-pip-version-check --no-input -r requirements-test.txt
      - name: Verify third-party dependency attribution
        run: python scripts/generate_third_party_notices.py --python "$(command -v python)" --check
      - name: Root tests in normal and optimized mode
        run: python scripts/verify_repository.py root-tests

  backend-quality:
    needs: repository-validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Clean editable backend installation
        run: python -m pip install --disable-pip-version-check --no-input -e './backend[dev]'
      - name: Backend lint, types, tests, coverage, and XML regressions
        run: python scripts/verify_repository.py backend-quality

  dashboard-api:
    needs: repository-validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: dashboard_api/requirements.txt
      - name: Clean dashboard API installation
        run: python -m pip install --disable-pip-version-check --no-input -r dashboard_api/requirements.txt
      - name: Dashboard API and secure-lock regressions
        run: python scripts/verify_repository.py dashboard-api

  frontend:
    needs: repository-validation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend-dashboard/package-lock.json
      - name: Clean frontend installation
        working-directory: frontend-dashboard
        run: npm ci
      - name: Install clean E2E backend dependencies
        run: python -m pip install --disable-pip-version-check --no-input -r backend/requirements.txt
      - name: Install lockfile-pinned Playwright browser
        working-directory: frontend-dashboard
        run: npx playwright install --with-deps chromium
      - name: Frontend unit, lint, types, build, E2E, and audit
        env:
          AI_SCALPER_FRONTEND_DEPS_PREINSTALLED: "1"
          VITE_API_BASE_URL: http://127.0.0.1:8000/api/v1
          VITE_WS_URL: ws://127.0.0.1:8000/api/v1/ws
        run: python scripts/verify_repository.py frontend

  dependency-security:
    needs: repository-validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-test.txt
            requirements.txt
            backend/requirements.txt
            dashboard_api/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install clean security-test dependencies and pinned audit tooling
        run: python -m pip install --disable-pip-version-check --no-input -r requirements-test.txt pip-audit==2.10.1
      - name: XML, secure-lock, and safety regressions
        run: python scripts/verify_repository.py security-regressions
      - name: Audit Python manifests
        run: |
          python -m pip_audit --strict -r requirements.txt
          python -m pip_audit --strict -r backend/requirements.txt
          python -m pip_audit --strict -r dashboard_api/requirements.txt
      - name: Audit frontend lockfile
        working-directory: frontend-dashboard
        run: npm audit --audit-level=high

  release-verifier:
    needs: repository-validation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build, compare, and verify two atomic base suites
        run: python scripts/verify_repository.py release
